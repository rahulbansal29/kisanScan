<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KisanScan – Crop Doctor</title>
<style>
  :root{
    --g:#146c34;--g-dark:#0d4d24;--g-soft:#e6f4ea;--g-line:#b7dcc3;
    --ink:#14201a;--mut:#3f5247;--line:#d3e0d7;--bg:#eef4ef;--card:#fff;
    --red:#b42318;--red-soft:#fdecea;--amb:#a65b00;--amb-soft:#fff3dc;
    --shadow:0 2px 10px rgba(20,60,35,.08);
  }
  *{box-sizing:border-box}
  html{font-size:17px}
  body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari",sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
  button{font:inherit}
  header{background:linear-gradient(135deg,var(--g-dark),var(--g));color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.15)}
  .top{max-width:820px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{display:flex;align-items:center;gap:10px}
  .logo{width:44px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:1.6rem;flex:none}
  header h1{margin:0;font-size:1.45rem;line-height:1.15;letter-spacing:.2px}
  header small{display:block;font-weight:500;font-size:.85rem;opacity:.92}
  .lang{display:flex;background:rgba(255,255,255,.15);border:1.5px solid rgba(255,255,255,.6);border-radius:999px;padding:3px}
  .lang button{background:none;border:0;color:#fff;padding:7px 14px;cursor:pointer;border-radius:999px;font-weight:600}
  .lang button.on{background:#fff;color:var(--g-dark)}
  .steps{max-width:820px;margin:0 auto;padding:0 16px 14px;display:flex;gap:8px;flex-wrap:wrap}
  .steps span{background:rgba(255,255,255,.16);border-radius:999px;padding:4px 12px;font-size:.85rem;font-weight:600}
  main{max-width:820px;margin:0 auto;padding:18px 16px 40px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:var(--shadow)}
  h2{margin:0 0 12px;font-size:1.2rem;display:flex;align-items:center;gap:10px}
  .num{width:30px;height:30px;border-radius:50%;background:var(--g);color:#fff;display:inline-grid;place-items:center;font-size:.95rem;flex:none}
  .crops{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px;margin-bottom:6px}
  .chip{display:flex;align-items:center;gap:8px;padding:11px 12px;border:2px solid var(--line);border-radius:14px;background:#fff;cursor:pointer;font-weight:600;color:var(--ink);text-align:left;line-height:1.2;min-height:52px}
  .chip .e{font-size:1.45rem;flex:none}
  .chip:hover{border-color:var(--g-line);background:#f7fbf8}
  .chip.on{border-color:var(--g);background:var(--g-soft);box-shadow:0 0 0 2px var(--g) inset}
  .chip.other{grid-column:1/-1;justify-content:center;border-style:dashed;color:var(--mut)}
  .chip.other.on{color:var(--g-dark)}
  #crop{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
  .sect{margin-top:22px}
  .drop{display:block;border:2.5px dashed var(--g-line);border-radius:16px;padding:26px 16px;text-align:center;cursor:pointer;background:var(--g-soft);transition:border-color .15s}
  .drop:hover{border-color:var(--g)}
  .drop .cam{font-size:2.8rem;line-height:1}
  .drop b{display:block;font-size:1.1rem;margin:8px 0 4px;color:var(--g-dark)}
  .drop img{max-width:100%;max-height:300px;border-radius:12px;display:block;margin:0 auto}
  .samples{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .samples .note{margin-right:4px}
  .samples button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:.88rem;cursor:pointer;color:var(--ink)}
  .samples button:hover{border-color:var(--g);color:var(--g-dark)}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;background:var(--g);color:#fff;border:0;border-radius:14px;padding:16px 20px;font-size:1.15rem;font-weight:700;cursor:pointer;width:100%;margin-top:18px;box-shadow:0 3px 0 var(--g-dark)}
  .btn:hover:not(:disabled){background:var(--g-dark)}
  .btn:disabled{background:#9db8a6;box-shadow:none;cursor:default}
  .msg{border-left:6px solid var(--amb);background:var(--amb-soft);color:#5c3500;padding:14px 16px;border-radius:12px;margin-top:14px;font-size:1rem;font-weight:500}
  #resultCard{padding:0;overflow:hidden;scroll-margin-top:130px}
  #cropChips{scroll-margin-top:130px}
  .res-head{padding:20px;color:#fff;background:var(--g);display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
  #resultCard[data-sev=high] .res-head{background:linear-gradient(135deg,#8f1c13,var(--red))}
  #resultCard[data-sev=medium] .res-head{background:linear-gradient(135deg,#7a4300,#b86a00)}
  #resultCard[data-sev=none] .res-head{background:linear-gradient(135deg,var(--g-dark),var(--g))}
  .crop{font-size:.95rem;font-weight:600;opacity:.9}
  .dname{font-size:1.65rem;font-weight:800;margin:2px 0 10px;line-height:1.2}
  .badge{display:inline-block;padding:5px 14px;border-radius:999px;font-size:.9rem;font-weight:700;background:#fff}
  .sev-high{color:var(--red)} .sev-medium{color:var(--amb)} .sev-none{color:var(--g)}
  .speak{background:#fff;color:var(--ink);border:0;border-radius:12px;padding:12px 18px;font-weight:700;font-size:1.05rem;cursor:pointer;display:flex;gap:8px;align-items:center}
  .speak:hover{background:#f0f0f0}
  .res-body{padding:20px}
  .conf{display:flex;justify-content:space-between;font-weight:600;color:var(--mut)}
  .conf b{color:var(--ink);font-size:1.15rem}
  .bar{height:14px;background:#e3ebe5;border-radius:99px;overflow:hidden;margin:6px 0 4px}
  .bar i{display:block;height:100%;background:var(--g);border-radius:99px}
  .box{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-top:14px}
  .box h3{margin:0 0 6px;font-size:1.05rem;display:flex;align-items:center;gap:8px;color:var(--g-dark)}
  .box.treat{background:#fffaf0;border-color:#f2d9a6}
  .box.treat h3{color:#8a4b00}
  ul{margin:4px 0 0;padding-left:22px} li{margin:5px 0}
  .note{font-size:.88rem;color:var(--mut)}
  .alt{margin-top:14px}
  .warn{border-left:6px solid var(--amb);background:var(--amb-soft);color:#5c3500;padding:12px 14px;border-radius:12px;margin:12px 0 0;font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
  .stat{background:var(--g-soft);border-radius:14px;padding:14px 10px;text-align:center}
  .stat b{display:block;font-size:1.8rem;color:var(--g-dark);line-height:1.2}
  .stat.sick{background:var(--red-soft)} .stat.sick b{color:var(--red)}
  .stat span{font-size:.85rem;color:var(--mut);font-weight:600}
  .tbl{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.95rem}
  th{font-size:.82rem;text-transform:uppercase;letter-spacing:.4px;color:var(--mut)}
  td,th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}
  .hidden,.drop img.hidden{display:none}
  .spin{width:20px;height:20px;border:3px solid #fff6;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  button:focus-visible,.drop:focus-within{outline:3px solid #f5b700;outline-offset:2px}
  @media (max-width:480px){html{font-size:16px} .card{padding:16px} .dname{font-size:1.4rem} .crops{grid-template-columns:repeat(2,1fr)} .steps span{font-size:.78rem}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand"><div class="logo">🌿</div><h1>KisanScan <small data-t="tag"></small></h1></div>
    <div class="lang"><button id="lenBtn" class="on">EN</button><button id="lhiBtn">हिंदी</button></div>
  </div>
  <div class="steps"><span data-t="s1"></span><span data-t="s2"></span><span data-t="s3"></span></div>
</header>
<main>
  <section class="card">
    <h2><span class="num">1</span><span data-t="cropQ"></span></h2>
    <select id="crop" aria-hidden="true" tabindex="-1">
      <option value="" data-t="cropPick"></option>
      {% for en, hi in crops.items() %}<option value="{{ en }}" data-en="{{ en }}" data-hi="{{ hi }}">{{ en }}</option>
      {% endfor %}<option value="other" data-t="cropOther"></option>
    </select>
    <div class="crops" id="cropChips" role="radiogroup"></div>

    <div class="sect">
      <h2><span class="num">2</span><span data-t="step1"></span></h2>
      <label class="drop" id="drop">
        <input id="file" type="file" accept="image/*" capture="environment" hidden>
        <div id="dropText"><div class="cam">📷</div><b data-t="upload"></b><div class="note" data-t="uploadHint"></div></div>
        <img id="preview" class="hidden" alt="Leaf photo preview">
      </label>
      <div class="samples"><span class="note" data-t="samples"></span><span id="sampleList" style="display:contents"></span></div>
    </div>

    <button class="btn" id="scanBtn" disabled><span data-t="scan"></span></button>
    <div class="msg hidden" id="msg"></div>
  </section>

  <section class="card hidden" id="resultCard">
    <div class="res-head">
      <div>
        <div class="crop" id="rCrop"></div>
        <div class="dname" id="rName"></div>
        <span class="badge" id="rSev"></span>
      </div>
      <button class="speak" id="speakBtn">🔊 <span data-t="listen"></span></button>
    </div>
    <div class="res-body">
      <div class="conf"><span data-t="confidence"></span><b id="rConf"></b></div>
      <div class="bar"><i id="rBar"></i></div>
      <div class="warn hidden" id="rWarn"></div>
      <div class="box"><h3>🔍 <span data-t="cause"></span></h3><div id="rCause"></div></div>
      <div class="box treat"><h3>💊 <span data-t="treat"></span></h3><ul id="rTreat"></ul></div>
      <div class="box"><h3>🛡️ <span data-t="prevent"></span></h3><ul id="rPrev"></ul></div>
      <div class="note alt" id="rAlt"></div>
      <p class="note" data-t="disclaimer"></p>
    </div>
  </section>

  <section class="card">
    <h2>📊 <span data-t="dash"></span></h2>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><span data-t="sTotal"></span></div>
      <div class="stat sick"><b id="sSick">0</b><span data-t="sSick"></span></div>
      <div class="stat"><b id="sTop">–</b><span data-t="sTop"></span></div>
    </div>
    <div class="tbl"><table><thead><tr><th data-t="hTime"></th><th data-t="hCrop"></th><th data-t="hResult"></th><th>%</th></tr></thead><tbody id="hist"></tbody></table></div>
  </section>
</main>
<script>
const T={
 en:{tag:"AI crop doctor for farmers",s1:"1. Choose crop",s2:"2. Take photo",s3:"3. Get advice",step1:"Take or upload a photo of one leaf",upload:"Tap to take photo / choose image",uploadHint:"Clear, close-up photo of a single leaf in daylight works best",samples:"Or try a sample leaf:",scan:"Check my crop",scanning:"Checking...",listen:"Listen",confidence:"AI confidence",cause:"What is it?",treat:"What to do now",prevent:"How to prevent it",alt:"Other possibilities",disclaimer:"Doses are typical label rates. Read the product label and confirm with your local KVK / agriculture officer before spraying.",dash:"Scan history & disease alerts",sTotal:"Total scans",sSick:"Diseased",sTop:"Most common",hTime:"Time",hCrop:"Crop",hResult:"Result",low:"⚠️ The AI is not sure. Please retake the photo: one leaf, close-up, good light, plain background.",sev:{high:"High risk – act today",medium:"Medium risk",none:"Healthy"},healthy:"Healthy",notLeaf:"🌿 This does not look like a plant leaf. Please take a close-up photo of one leaf.",err:"Something went wrong. Please try again.",cropQ:"Which crop is this?",cropPick:"– Select your crop –",cropOther:"Other crop – not in this list",needCrop:"Please select your crop first.",unsupported:c=>"🙏 Sorry, KisanScan cannot check this crop yet. It currently supports: "+c+". More crops (wheat, rice, cotton) are coming.",wrongCrop:(c,g)=>"🤔 This photo does not look like a "+c+" leaf (it looks more like "+g+"). Please check the crop you selected, or retake the photo of one "+c+" leaf. If your plant is not in the list, choose “Other crop”."},
 hi:{tag:"किसानों के लिए AI फसल डॉक्टर",s1:"1. फसल चुनें",s2:"2. फोटो लें",s3:"3. सलाह पाएँ",step1:"एक पत्ती की फोटो लें या अपलोड करें",upload:"फोटो लेने / चुनने के लिए दबाएँ",uploadHint:"दिन की रोशनी में एक पत्ती की साफ़, पास से फोटो सबसे अच्छी रहती है",samples:"या नमूना पत्ती आज़माएँ:",scan:"मेरी फसल जाँचें",scanning:"जाँच हो रही है...",listen:"सुनें",confidence:"AI का भरोसा",cause:"यह क्या है?",treat:"अभी क्या करें",prevent:"बचाव कैसे करें",alt:"अन्य संभावनाएँ",disclaimer:"मात्रा सामान्य लेबल दर है। छिड़काव से पहले उत्पाद का लेबल पढ़ें और अपने KVK / कृषि अधिकारी से पुष्टि करें।",dash:"जाँच इतिहास और रोग चेतावनी",sTotal:"कुल जाँच",sSick:"रोगग्रस्त",sTop:"सबसे आम रोग",hTime:"समय",hCrop:"फसल",hResult:"परिणाम",low:"⚠️ AI को पक्का भरोसा नहीं है। कृपया फिर से फोटो लें: एक पत्ती, पास से, अच्छी रोशनी, सादा पृष्ठभूमि।",sev:{high:"अधिक खतरा – आज ही उपाय करें",medium:"मध्यम खतरा",none:"स्वस्थ"},healthy:"स्वस्थ",notLeaf:"🌿 यह पौधे की पत्ती नहीं लग रही। कृपया एक पत्ती की पास से फोटो लें।",err:"कुछ गलत हुआ। कृपया दोबारा प्रयास करें।",cropQ:"यह कौन सी फसल है?",cropPick:"– अपनी फसल चुनें –",cropOther:"अन्य फसल – सूची में नहीं",needCrop:"कृपया पहले अपनी फसल चुनें।",unsupported:c=>"🙏 माफ़ कीजिए, KisanScan अभी इस फसल की जाँच नहीं कर सकता। अभी ये फसलें शामिल हैं: "+c+"। गेहूँ, धान और कपास जल्द आ रहे हैं।",wrongCrop:(c,g)=>"🤔 यह फोटो "+c+" की पत्ती जैसी नहीं लग रही (यह "+g+" जैसी लग रही है)। कृपया चुनी गई फसल जाँचें, या "+c+" की एक पत्ती की फिर से फोटो लें। अगर आपकी फसल सूची में नहीं है, तो “अन्य फसल” चुनें।"}
};
let lang=localStorageGet()||"en", last=null, file=null;
function localStorageGet(){try{return localStorage.getItem("ks_lang")}catch(e){return null}}
const $=id=>document.getElementById(id);

function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(el=>el.textContent=T[lang][el.dataset.t]);
  document.querySelectorAll("#crop option[data-en]").forEach(o=>o.textContent=lang==="hi"?`${o.dataset.hi} (${o.dataset.en})`:o.dataset.en);
  buildChips();
  $("lenBtn").classList.toggle("on",lang==="en"); $("lhiBtn").classList.toggle("on",lang==="hi");
  try{localStorage.setItem("ks_lang",lang)}catch(e){}
  if(last) render(last);
}
// Big tap-friendly crop buttons; the hidden <select id="crop"> still holds the chosen value.
const EMOJI={"Apple":"🍎","Blueberry":"🫐","Cherry":"🍒","Corn (Maize)":"🌽","Grape":"🍇","Orange":"🍊","Peach":"🍑",
  "Bell Pepper":"🫑","Potato":"🥔","Raspberry":"🌱","Soybean":"🫘","Squash":"🎃","Strawberry":"🍓","Tomato":"🍅"};
function buildChips(){
  const box=$("cropChips"); box.innerHTML="";
  document.querySelectorAll("#crop option").forEach(o=>{
    if(!o.value) return;
    const b=document.createElement("button"); b.type="button"; b.dataset.v=o.value;
    b.className="chip"+(o.value==="other"?" other":""); b.setAttribute("role","radio");
    const label=o.value==="other"?T[lang].cropOther:(lang==="hi"?o.dataset.hi:o.dataset.en);
    b.innerHTML=`<span class="e">${o.value==="other"?"❓":(EMOJI[o.value]||"🌱")}</span><span></span>`;
    b.lastChild.textContent=label;
    b.onclick=()=>setCrop(o.value);
    box.appendChild(b);
  });
  syncChips();
}
function syncChips(){document.querySelectorAll("#cropChips .chip").forEach(c=>{const on=c.dataset.v===$("crop").value;c.classList.toggle("on",on);c.setAttribute("aria-checked",on)});}
function setCrop(v){$("crop").value=v; syncChips(); showMsg("");}
$("lenBtn").onclick=()=>{lang="en";applyLang()};
$("lhiBtn").onclick=()=>{lang="hi";applyLang()};

$("file").onchange=e=>setFile(e.target.files[0]);
function setFile(f){
  file=f; if(!file) return;
  $("preview").src=URL.createObjectURL(file);
  $("preview").classList.remove("hidden"); $("dropText").classList.add("hidden");
  $("scanBtn").disabled=false; showMsg("");
}
function showMsg(t){$("msg").textContent=t; $("msg").classList.toggle("hidden",!t);}
$("crop").onchange=()=>showMsg("");
// sample file names start with the crop, e.g. Corn_maize_Common_rust.jpg -> "Corn (Maize)"
function cropFromName(n){const w=n.split("_")[0].toLowerCase();
  const o=[...document.querySelectorAll("#crop option[data-en]")].find(o=>o.value.toLowerCase().split(" ")[0]===w);
  return o?o.value:"";}
async function loadSamples(){
  try{
    const names=await (await fetch("/api/samples")).json();
    $("sampleList").innerHTML="";
    names.forEach(n=>{
      const b=document.createElement("button");
      b.textContent=n.replace(/\.jpg$/,"").replace(/_/g," ").replace(/^(\w+) \1 /,"$1 ");
      b.onclick=async()=>{const r=await fetch("/samples/"+encodeURIComponent(n));setCrop(cropFromName(n));setFile(new File([await r.blob()],n,{type:"image/jpeg"}));};
      $("sampleList").appendChild(b);
    });
  }catch(e){}
}

$("scanBtn").onclick=async()=>{
  if(!file) return;
  const crop=$("crop").value, hi=lang==="hi";
  if(!crop){showMsg(T[lang].needCrop); $("cropChips").scrollIntoView({behavior:"smooth",block:"center"}); return;}
  const b=$("scanBtn"); b.disabled=true; b.innerHTML=`<i class="spin"></i>${T[lang].scanning}`;
  showMsg(""); $("resultCard").classList.add("hidden"); last=null;
  try{
    const fd=new FormData(); fd.append("image",file); fd.append("crop",crop);
    const r=await fetch("/api/predict",{method:"POST",body:fd});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||T[lang].err);
    if(j.unsupported) showMsg(T[lang].unsupported(j.crops.map(c=>hi?c.hi:c.en).join(", ")));
    else if(j.not_leaf) showMsg(T[lang].notLeaf);
    else if(j.wrong_crop) showMsg(T[lang].wrongCrop(hi?j.crop_hi:j.crop, hi?j.looks_like_hi:j.looks_like));
    else{ last=j; render(j); loadHistory(); $("resultCard").scrollIntoView({behavior:"smooth"}); }
  }catch(e){showMsg(e.message||T[lang].err)}
  b.disabled=false; b.innerHTML=`<span data-t="scan">${T[lang].scan}</span>`;
};

function render(j){
  const r=j.result, hi=lang==="hi";
  $("resultCard").classList.remove("hidden");
  $("rCrop").textContent=hi?r.crop_hi:r.crop;
  $("rName").textContent=hi?r.name_hi:r.name_en;
  $("resultCard").dataset.sev=r.severity;
  $("rSev").className="badge sev-"+r.severity; $("rSev").textContent=T[lang].sev[r.severity];
  $("rBar").style.width=r.confidence+"%"; $("rConf").textContent=r.confidence+"%";
  $("rWarn").classList.toggle("hidden",!j.low_confidence); $("rWarn").textContent=T[lang].low;
  $("rCause").textContent=hi?r.cause_hi:r.cause_en;
  $("rTreat").innerHTML=(hi?r.treat_hi:r.treat_en).map(x=>`<li>${x}</li>`).join("");
  $("rPrev").innerHTML=(hi?r.prevent_hi:r.prevent_en).map(x=>`<li>${x}</li>`).join("");
  $("rAlt").textContent=T[lang].alt+": "+j.alternatives.map(a=>`${hi?a.name_hi:a.name_en} (${a.confidence}%)`).join(", ");
}

$("speakBtn").onclick=()=>{
  if(!last||!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const voices=speechSynthesis.getVoices(), r=last.result;
  const hiVoice=voices.find(v=>v.lang.replace("_","-").toLowerCase().startsWith("hi"));
  const hi=lang==="hi"&&!!hiVoice;
  if(lang==="hi"&&!hiVoice) $("rWarn").classList.remove("hidden"), $("rWarn").textContent="🔊 इस ब्राउज़र में हिंदी आवाज़ नहीं है, अंग्रेज़ी में सुना रहे हैं। (Use Chrome/Edge for a Hindi voice.)";
  const text=[hi?r.name_hi:r.name_en, hi?r.cause_hi:r.cause_en, hi?T.hi.treat:T.en.treat, ...(hi?r.treat_hi:r.treat_en)].join(". ");
  const u=new SpeechSynthesisUtterance(text); u.lang=hi?"hi-IN":"en-IN"; u.rate=.95;
  const v=hi?hiVoice:(voices.find(v=>v.lang.replace("_","-")==="en-IN")||voices.find(v=>v.lang.startsWith("en")));
  if(v) u.voice=v;
  speechSynthesis.speak(u);
};

async function loadHistory(){
  try{
    const j=await (await fetch("/api/history")).json();
    $("sTotal").textContent=j.total; $("sSick").textContent=j.diseased;
    $("sTop").textContent=j.top_diseases[0]?j.top_diseases[0].disease:"–";
    $("sTop").style.fontSize=j.top_diseases[0]?".85rem":"";
    $("hist").innerHTML=j.scans.map(s=>`<tr><td>${s.ts.slice(5,16).replace("T"," ")}</td><td>${s.crop}</td><td>${s.healthy?"✅ "+T[lang].healthy:"🦠 "+s.disease}</td><td>${s.confidence}</td></tr>`).join("");
  }catch(e){}
}
applyLang(); loadHistory(); loadSamples().then(async()=>{
  // ?sample=Tomato_Late_blight.jpg loads a sample and scans it (demo backup link)
  const s=new URLSearchParams(location.search).get("sample"); if(!s) return;
  const r=await fetch("/samples/"+encodeURIComponent(s)); if(!r.ok) return;
  setCrop(cropFromName(s)); setFile(new File([await r.blob()],s,{type:"image/jpeg"})); $("scanBtn").click();
});
</script>
